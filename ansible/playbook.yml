---
- name: Setup Sparks FC Website
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - nginx
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy website files
      copy:
        src: ../frontend/dist/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Configure Nginx for React
      copy:
        content: |
          server {
            listen 80;
            root /var/www/html;
            index index.html;
            location / {
              try_files $uri $uri/ /index.html;
            }
          }
        dest: /etc/nginx/sites-available/default
      notify: restart nginx

  handlers:
    - name: restart nginx
      service:
        name: nginx
        state: restarted
